name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Codegen runs through node --experimental-strip-types, which needs Node 22.6+.
      # This is a dev-tooling limit only: the published package is compiled JS and the
      # smoke test below proves it works on every Node in the matrix.
      # catalog:check is deliberately absent: it diffs against the scraper repo, which is
      # not checked out here. It runs locally before a catalog refresh.
      - name: Generated sources match the vendored catalog
        if: matrix.node == '24'
        run: pnpm -F quranic-audio-router gen:check

      - name: Typecheck
        run: pnpm -F quranic-audio-router typecheck

      - name: Unit tests
        run: pnpm -F quranic-audio-router test

      - name: Build
        run: pnpm -F quranic-audio-router build

      - name: Tarball contains only what it should
        run: node packages/quranic-audio-router/test/packaging/assert-pack.mjs

      - name: Bundle size budget
        run: node packages/quranic-audio-router/test/packaging/assert-size.mjs

      - name: Packaging smoke test in a clean consumer
        run: node packages/quranic-audio-router/test/packaging/smoke.mjs

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F quranic-audio-router build
      - run: pnpm -F playground typecheck
      - run: pnpm -F playground build
