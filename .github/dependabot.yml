version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/playground"
      - "/packages/quranic-audio-router"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
